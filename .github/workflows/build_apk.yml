name: Build Reality Duel APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Android project
        run: flutter create . --platforms=android --android-language=kotlin
      - name: Set Android SDK 36
        run: |
          sdkmanager "platforms;android-36"

          python3 - <<'PY'
          from pathlib import Path

          for path in Path("android").rglob("*"):
              if path.is_file() and path.suffix in [".gradle", ".kts"]:
                  text = path.read_text()

                  text = text.replace(
                      "compileSdk = 34",
                      "compileSdk = 36"
                  )

                  text = text.replace(
                      "compileSdk 34",
                      "compileSdk 36"
                  )

                  text = text.replace(
                      "compileSdkVersion 34",
                      "compileSdkVersion 36"
                  )

                  text = text.replace(
                      "compileSdk = flutter.compileSdkVersion",
                      "compileSdk = 36"
                  )

                  text = text.replace(
                      "compileSdk flutter.compileSdkVersion",
                      "compileSdk 36"
                  )

                  path.write_text(text)
                  print("Checked:", path)
          PY
 
      - name: Verify compileSdk
        run: |
          echo "Android compileSdk settings:"    
       grep -Rni "compileSdk" android || true
      - name: Verify Android compileSdk
        run: |
          grep -R "compileSdk" android/app/
      - name: Enable Internet
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET"/>'

          if permission not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + permission
              )

          path.write_text(text)
          PY

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reality-duel-apk
          path: build/app/outputs/flutter-apk/app-release.apk
