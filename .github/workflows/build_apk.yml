name: Build Reality Duel APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Android project
        run: flutter create . --platforms=android --android-language=kotlin
      - name: Set Android compileSdk 36
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          found = False

          for path in files:
              if path.exists():
                  found = True
                  text = path.read_text()

                  import re

                  text = re.sub(
                      r'compileSdk(?:Version)?\s*[= ]\s*(?:flutter\.compileSdkVersion|34)',
                      lambda m: (
                          "compileSdk = 36"
                          if "=" in m.group(0)
                          else "compileSdk 36"
                      ),
                      text
                  )

                  path.write_text(text)

                  print("Updated:", path)
                  print(
                      "compileSdk lines:",
                      [
                          line.strip()
                          for line in text.splitlines()
                          if "compileSdk" in line
                      ]
                  )

          if not found:
              raise SystemExit("ERROR: Android app Gradle file not found")
          PY
      - name: Verify Android compileSdk
        run: |
         grep -R "compileSdk" android/app/
      - name: Enable Internet
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET"/>'

          if permission not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + permission
              )

          path.write_text(text)
          PY

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reality-duel-apk
          path: build/app/outputs/flutter-apk/app-release.apk
