name: Build Reality Duel APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"
          yes | sdkmanager --licenses || true

      - name: Generate Android project
        run: |
          flutter create . \
            --platforms=android \
            --android-language=kotlin

      - name: Get dependencies
        run: flutter pub get

      - name: Force compileSdk 36
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roots = [
              Path("android"),
              Path.home() / ".pub-cache" / "hosted" / "pub.dev",
          ]

          replacements = {
              "compileSdk = 34": "compileSdk = 36",
              "compileSdk 34": "compileSdk 36",
              "compileSdkVersion 34": "compileSdkVersion 36",
              "compileSdk = flutter.compileSdkVersion": "compileSdk = 36",
              "compileSdk flutter.compileSdkVersion": "compileSdk 36",
              "compileSdkVersion flutter.compileSdkVersion": "compileSdkVersion 36",
          }

          for root in roots:
              if not root.exists():
                  continue

              for path in root.rglob("*"):
                  if not path.is_file():
                      continue

                  if path.suffix not in [".gradle", ".kts"]:
                      continue

                  try:
                      text = path.read_text()
                  except Exception:
                      continue

                  original = text

                  for old, new in replacements.items():
                      text = text.replace(old, new)

                  if text != original:
                      path.write_text(text)
                      print("Updated:", path)

          PY

      - name: Verify compileSdk
        run: |
          echo "=== Android project ==="
          grep -Rni "compileSdk" android || true

          echo ""
          echo "=== file_picker ==="
          find "$HOME/.pub-cache/hosted/pub.dev" \
            -maxdepth 1 \
            -type d \
            -name "file_picker-*" \
            -print

          grep -Rni "compileSdk" \
            "$HOME/.pub-cache/hosted/pub.dev/file_picker-"* \
            2>/dev/null || true

      - name: Enable Internet
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")

          if path.exists():
              text = path.read_text()

              permission = '<uses-permission android:name="android.permission.INTERNET"/>'

              if permission not in text:
                  text = text.replace(
                      '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                      '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + permission
                  )

                  path.write_text(text)
          PY

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reality-duel-apk
          path: build/app/outputs/flutter-apk/app-release.apk
