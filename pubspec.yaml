name: reality_duel
description: Reality Duel - The World Is Your Arena.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.9.1

  # Video playback
  video_player: ^2.10.0

  # Pick videos/photos from phone
  image_picker: ^1.1.2

  # Local file selection
  file_picker: ^8.1.2

  # Open external links
  url_launcher: ^6.3.1

  # UUID generation
  uuid: ^4.5.1

  # Cached network images
  cached_network_image: ^3.4.1

  # Internationalization / RTL helpers
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
