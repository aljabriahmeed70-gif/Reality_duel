name: reality_duel
description: Reality Duel - The World Is Your Arena
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.9.1

  # Video
  video_player: ^2.10.0

  # Pick images/videos/files
  file_picker: ^8.1.2

  # Open URLs
  url_launcher: ^6.3.2

  # Cached network images
  cached_network_image: ^3.4.1

  # Localization
  intl: ^0.19.0

  # Permissions
  permission_handler: ^11.3.1

  # Sharing
  share_plus: ^10.1.4

  # Unique IDs
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
